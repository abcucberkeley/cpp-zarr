name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-python:
    name: C++ and Python (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04, shell: bash,        generator: Unix Makefiles }
          - { name: macOS,   os: macos-15,     shell: bash,        generator: Unix Makefiles }
          - { name: Windows, os: windows-2025, shell: 'msys2 {0}', generator: Ninja }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    # The tests read arrays written by zarr-python and TensorStore (made below), and
    # fail here if they are missing (elsewhere they are skipped)
    env:
      CPPZARR_REQUIRE_TEST_ARRAYS: '1'
    steps:
      - uses: actions/checkout@v7

      # The library's build flags and OpenMP setup are GCC-only, so Windows uses
      # MinGW. The Python tests use MSYS2's Python, so they share one toolchain.
      # MSYS2 packages GCC's OpenMP runtime (libgomp) separately from gcc.
      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: gcc:p libgomp:p cmake:p ninja:p python:p python-numpy:p pybind11:p

      # Same compiler as the release builds. Apple clang has no OpenMP.
      - name: Set up GCC 13 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc@13 > /dev/null 2>&1 || brew install gcc@13
          echo "CC=$(brew --prefix gcc@13)/bin/gcc-13" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc@13)/bin/g++-13" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Zarr v3 test arrays (and v2 ones with codecs cpp-zarr does not write) from
      # zarr-python and TensorStore, for the tests to read. Pinned versions, so a new
      # release cannot change the test data. On Windows this is the Python from
      # setup-python (Git Bash), since MSYS2's has no TensorStore or numcodecs.
      - name: Make the test arrays
        shell: bash
        run: |
          python -m pip install "zarr==3.1.6" "numcodecs==0.16.5" "tensorstore==0.1.85" "ml_dtypes==0.6.0" numpy
          python tests/make_test_arrays.py

      - name: Build library and C++ tests
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCPPZARR_BUILD_TESTS=ON -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4
          cmake --install build --prefix install

      # The installed library names no folder of this machine, and on Windows a source named with \
      # (as the release build names them) is remapped too (see the script)
      - name: No build paths in the library
        run: |
          case "$RUNNER_OS" in
            Windows) LIB=install/bin/libcppZarr.dll ;;
            macOS)   LIB=install/lib/libcppZarr.dylib ;;
            *)       LIB=install/lib/libcppZarr.so ;;
          esac
          bash .github/scripts/check_build_paths.sh "$PWD" "$LIB" "$PWD/build"

      # The installed library exports none of its static C++ runtime or nlohmann/json's code, and
      # still its API (see the script)
      - name: No C++ runtime in the library's exports
        if: runner.os != 'Windows'
        run: |
          case "$RUNNER_OS" in
            macOS) LIB=install/lib/libcppZarr.dylib ;;
            *)     LIB=install/lib/libcppZarr.so ;;
          esac
          bash .github/scripts/check_exports.sh "$LIB"

      - name: C++ tests
        run: ctest --test-dir build --output-on-failure

      # Compiles the extension straight against the library built above, then
      # runs the same test file cibuildwheel runs against the release wheels.
      # On Linux and macOS it links like python/setup.py does (static libstdc++
      # after the library, kept private to the module).
      - name: Python tests
        run: |
          EXT=$(python -c "import sysconfig; print(sysconfig.get_config_var('EXT_SUFFIX'))")
          case "$RUNNER_OS" in
            Linux)
              python -m pip install numpy pybind11 ml_dtypes
              FLAGS="-fPIC $(python -m pybind11 --includes) -Wl,-rpath,$PWD/install/lib -static-libstdc++ -Wl,--exclude-libs,ALL" ;;
            macOS)
              python -m pip install numpy pybind11 ml_dtypes
              FLAGS="-fPIC $(python -m pybind11 --includes) -isysroot $(xcrun --show-sdk-path) -undefined dynamic_lookup -Wl,-rpath,$PWD/install/lib -static-libstdc++ -Wl,-exported_symbol,_PyInit_cppzarr" ;;
            Windows)
              PYINC=$(python -c "import sysconfig; print(sysconfig.get_path('include'))")
              PYVER=$(python -c "import sysconfig; print(sysconfig.get_config_var('LDVERSION'))")
              FLAGS="-I$PYINC -lpython$PYVER"
              cp install/bin/libcppZarr.dll python/cppzarr/ ;;
          esac
          "${CXX:-g++}" -O2 -std=c++17 -shared python/cppzarr.cpp -o "python/cppzarr/cppzarr$EXT" \
            -Iinstall/include -Linstall/lib -lcppZarr $FLAGS
          if [ "$RUNNER_OS" = macOS ]; then
            bash .github/scripts/check_exports.sh install/lib/libcppZarr.dylib "python/cppzarr/cppzarr$EXT"
          fi
          PYTHONPATH=python python python/tests/test_python.py

  matlab:
    name: MATLAB (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-24.04, shell: bash,        generator: Unix Makefiles }
          - { name: macOS,   os: macos-15,     shell: bash,        generator: Unix Makefiles }
          - { name: Windows, os: windows-2025, shell: 'msys2 {0}', generator: Ninja }
    defaults:
      run:
        shell: ${{ matrix.shell }}
    # The tests read arrays written by zarr-python and TensorStore (made below), and
    # fail here if they are missing (elsewhere they are skipped)
    env:
      CPPZARR_REQUIRE_TEST_ARRAYS: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: gcc:p libgomp:p cmake:p ninja:p

      # MATLAB finds MinGW through MW_MINGW64_LOC; build_mex.m selects it.
      - name: Point MATLAB at MinGW (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"MW_MINGW64_LOC=${{ steps.msys2.outputs.msys2-location }}\ucrt64" >> $env:GITHUB_ENV'

      - name: Set up GCC 13 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc@13 > /dev/null 2>&1 || brew install gcc@13
          echo "CC=$(brew --prefix gcc@13)/bin/gcc-13" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix gcc@13)/bin/g++-13" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Zarr v3 test arrays (and v2 ones with codecs cpp-zarr does not write) from
      # zarr-python and TensorStore, for the tests to read. Pinned versions, so a new
      # release cannot change the test data. On Windows this is the Python from
      # setup-python (Git Bash), since MSYS2's has no TensorStore or numcodecs.
      - name: Make the test arrays
        shell: bash
        run: |
          python -m pip install "zarr==3.1.6" "numcodecs==0.16.5" "tensorstore==0.1.85" "ml_dtypes==0.6.0" numpy
          python tests/make_test_arrays.py

      - name: Build library
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build --parallel 4
          cmake --install build --prefix install

      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true

      # On macOS, MATLAB crashes while exiting once two OpenMP runtimes are
      # loaded (the library's libgomp and MATLAB's own), after the tests have
      # finished. So the marker file written after the last test decides the
      # result there, not MATLAB's exit code.
      - name: Build mex files and run MATLAB tests
        uses: matlab-actions/run-command@v3
        continue-on-error: ${{ runner.os == 'macOS' }}
        with:
          command: >-
            addpath('.github/scripts', 'tests');
            build_mex(fullfile(pwd, 'install'), fullfile(pwd, 'mex'));
            test_matlab(fullfile(pwd, 'mex'));
            fclose(fopen('matlab-tests-passed', 'w'));

      - name: Check MATLAB tests passed
        shell: bash
        run: test -f matlab-tests-passed || { echo "::error::MATLAB tests did not finish, see the previous step's log"; exit 1; }

      # The mex files run no OpenMP loops of their own (see the script)
      - name: No OpenMP in the mex files
        run: bash .github/scripts/check_mex_openmp.sh mex/*.mex*

      # The Windows mex files, with the DLLs they load (build_mex copies them next to the mex files),
      # for testing them in other projects' workflows
      - name: Upload the Windows mex files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: mex-windows
          path: mex/
          if-no-files-found: error
          retention-days: 14
